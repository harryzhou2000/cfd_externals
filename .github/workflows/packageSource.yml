name: Package Source Code

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    tags:
      - "v*"  # Runs when a version tag (v1.0, v2.1.3) is pushed

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # Prevents automatic submodule checkout

      - name: Initialize submodules
        run: git submodule update --init --recursive --depth=1

      - name: Prepare source directory
        run: |
          repo_name=$(basename $(pwd))  # Get repository name
          mkdir -p package/$repo_name
          rsync -av --exclude=package --exclude=.git ./ package/$repo_name/

      - name: Create tarball
        run: |
          tar -czf cfd_externals_source.tar.gz -C package .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: cfd_externals_source.tar.gz

      - name: Optional - Publish as GitHub Release
        if: startsWith(github.ref, 'refs/tags/')  # Runs only for tagged commits
        uses: softprops/action-gh-release@v2
        with:
          files: cfd_externals_source.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Source Code ${{ github.ref_name }}
          draft: true
          prerelease: false
